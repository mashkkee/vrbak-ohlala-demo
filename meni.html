<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meni · Vrbak Oh la la</title>
<meta name="theme-color" content="#1c2d28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1c2d28; --green-2:#27403a; --green-3:#35554c; --ink:#121a17; --cream:#f4eee2; --paper:#fbf8f2; --white:#fff;
  --orange:#e08a2e; --text:#4a5a54; --muted:#7d8b85; --line:rgba(28,45,40,.12); --line-l:rgba(244,238,226,.16);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif; --script:"Parisienne",cursive;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:128px}
body{font-family:var(--sans);background:var(--green);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:720px;margin-inline:auto;background:var(--paper);min-height:100vh;position:relative;box-shadow:0 0 90px rgba(0,0,0,.35)}

/* zaglavlje */
.top{background:var(--green);color:var(--cream);padding:22px 20px 26px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1px solid var(--line-l);box-shadow:0 0 0 34px rgba(244,238,226,.035),0 0 0 72px rgba(244,238,226,.025)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
.logo{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.05em;display:flex;align-items:baseline;gap:7px}
.logo span{font-family:var(--script);color:var(--orange);font-size:1.45rem;letter-spacing:0}
.lang{display:flex;background:rgba(244,238,226,.1);border-radius:999px;padding:3px;border:1px solid var(--line-l)}
.lang button{padding:6px 13px;border-radius:999px;font-size:.76rem;font-weight:700;letter-spacing:.06em;opacity:.7}
.lang button.on{background:var(--cream);color:var(--green);opacity:1}
.top h1{font-family:var(--serif);font-weight:500;font-size:2.5rem;line-height:1.05;margin:26px 0 6px;position:relative;z-index:1}
.top p{color:#b9c6c0;font-size:.9rem;position:relative;z-index:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.meta span{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;padding:7px 12px;border-radius:999px;background:rgba(244,238,226,.08);border:1px solid var(--line-l)}
.meta .i{width:15px;height:15px;color:var(--orange)}
.meta .sto{background:var(--orange);color:#1b1206;border-color:transparent;font-weight:700}
.meta .sto .i{color:#1b1206}

/* pretraga i kategorije */
.sticky{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:0 14px;height:46px;border-radius:14px;background:var(--white);border:1px solid var(--line)}
.search .i{color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:1rem;color:var(--ink);min-width:0}
.search button{color:var(--muted);display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:.84rem;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip.on{background:var(--green);color:var(--cream);border-color:var(--green)}
.chip.veg{display:inline-flex;gap:6px;align-items:center;color:#2f7a4d;border-color:rgba(47,122,77,.35)}
.chip.veg.on{background:#2f7a4d;color:#fff;border-color:#2f7a4d}

/* stavke */
main{padding:6px 16px 150px}
.cat{padding-top:26px}
.cat h2{font-family:var(--serif);font-weight:600;font-size:1.95rem;display:flex;align-items:baseline;gap:10px}
.cat h2 small{font-family:var(--sans);font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.item{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item h3{font-size:1.02rem;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.item p{font-size:.86rem;color:var(--text);margin-top:3px;line-height:1.45}
.tag{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.tag.v{background:#e3f1e8;color:#2f7a4d}
.tag.s{background:#fcecd8;color:#a55d12}
.pr{font-weight:700;white-space:nowrap;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.92rem}
.pr i{font-style:normal;font-size:.66rem;color:var(--muted);margin-left:3px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;display:none}
.note{margin:34px 0 0;padding:16px;border-radius:14px;background:var(--cream);font-size:.8rem;color:var(--text);line-height:1.55}
mark{background:#fbe3c2;color:inherit;border-radius:3px;padding:0 1px}

/* konobar */
.dock{position:fixed;left:50%;translate:-50% 0;bottom:0;z-index:30;width:min(720px,100%);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;background:linear-gradient(180deg,rgba(251,248,242,0),rgba(251,248,242,.96) 34%)}
.dock button{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;font-weight:700;font-size:.95rem;transition:transform .15s var(--ease)}
.dock button:active{transform:scale(.97)}
.b-call{background:var(--orange);color:#1b1206;box-shadow:0 14px 30px -12px rgba(224,138,46,.8)}
.b-bill{background:var(--green);color:var(--cream);flex:.8!important}
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(18,26,23,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet.open{display:flex}
.sheet .box{width:min(720px,100%);background:var(--paper);border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:rise .35s var(--ease)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:1.9rem;font-weight:600;line-height:1.1}
.sheet p{color:var(--text);margin:8px 0 18px;font-size:.95rem}
.tables{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}
.tables button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);font-weight:700}
.tables button.on{background:var(--green);color:var(--cream);border-color:var(--green)}
.where{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.where b{grid-row:span 2;background:var(--orange);color:#1b1206;border-radius:12px;padding:12px 16px;font-size:1.15rem;font-weight:800;white-space:nowrap}
.where span{font-weight:700}
.where small{color:var(--muted);font-size:.78rem}
.sheet .go{width:100%;height:54px;border-radius:16px;background:var(--orange);color:#1b1206;font-weight:700;font-size:1rem}
.sheet .x{width:100%;height:46px;margin-top:8px;color:var(--muted);font-weight:600}
.ok{text-align:center;padding:8px 0 4px}
.ok .ring{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:#e3f1e8;color:#2f7a4d;display:grid;place-items:center;animation:pop .5s var(--ease)}
.ok .ring .i{width:38px;height:38px;stroke-width:2.2}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ok small{display:block;color:var(--muted);font-size:.8rem;margin-top:14px}
.ok a{color:var(--orange);font-weight:700}
.logo{white-space:nowrap}
@media (max-width:380px){.logo{font-size:1.2rem}.logo span{font-size:1.15rem}.top h1{font-size:2.1rem}.dock button{font-size:.82rem;gap:6px;height:50px}.dock .i{width:17px;height:17px}.tables{grid-template-columns:repeat(6,1fr);gap:6px}.tables button{height:40px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="bar">
      <a class="logo" href="index.html">VRBAK <span>Oh la la</span></a>
      <div class="lang"><button class="on" data-l="sr">SR</button><button data-l="en">EN</button></div>
    </div>
    <h1 data-sr="Meni" data-en="Menu">Meni</h1>
    <p data-sr="Hotel Vrbak · Kej 37. sandžačke divizije · Novi Pazar" data-en="Hotel Vrbak · Kej 37. sandžačke divizije · Novi Pazar">Hotel Vrbak · Kej 37. sandžačke divizije · Novi Pazar</p>
    <div class="meta">
      <span class="sto" id="stoBadge"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h16M6 9v10M18 9v10M9 9V5h6v4"/></svg><b id="stoTxt">Sto 7</b></span>
      <span><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>07:00 – 23:00</span>
      <span><svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>069 406 4070</span>
    </div>
  </header>

  <div class="sticky">
    <div class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg>
      <input id="q" type="search" placeholder="Pretraži jela i pića" autocomplete="off">
      <button id="clr" aria-label="Obriši"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <nav class="chips" id="chips"></nav>
  </div>

  <main>
    <div id="menu"></div>
    <div class="empty" id="empty"></div>
    <div class="note" id="note"></div>
  </main>
</div>

<div class="dock">
  <button class="b-call" data-kind="konobar"><svg class="i" viewBox="0 0 24 24"><path d="M6 16a6 6 0 0 1 12 0M4 16h16M12 7V5M10 5h4M5 19h14"/></svg><span data-sr="Pozovi konobara" data-en="Call the waiter">Pozovi konobara</span></button>
  <button class="b-bill" data-kind="racun"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h10v18l-2.500-1.500L12 21l-2.500-1.500L7 21zM10 8h4M10 12h4"/></svg><span data-sr="Račun" data-en="Bill">Račun</span></button>
</div>

<div class="sheet" id="sheet"><div class="box" id="box"></div></div>

<script src="menu.js"></script>
<script>
const T = {
  sr:{ph:"Pretraži jela i pića",all:"Sve",veg:"Vegetarijansko",rec:"Preporuka",v:"Veg",none:"Nema rezultata za",items:"stavki",sto:"Sto",
      note:"Demo digitalnog menija. Jela i cene su preuzeti iz menija koji je restoran objavio na Instagramu u februaru 2024, pa aktuelne cene mogu da se razlikuju.",
      callT:"Pozvati konobara?",billT:"Zatražiti račun?",callP:"Konobar zadužen za Vaš deo sale dobija obaveštenje na telefon sa brojem stola.",
      pick:"Broj stola je upisan u QR kod koji ste skenirali.",send:"Da, pozovi",cancel:"Odustani",
      okC:"Konobar je obavešten",okB:"Račun stiže",okP:(s,z)=>`Sto ${s} · ${z}. Neko dolazi do Vas za koji minut.`,close:"U redu",
      demo:"Demo: otvorite <a href='konobar.html' target='_blank'>plan sale za konobara</a> u drugom prozoru i videćete kako Vaš sto svetli."},
  en:{ph:"Search food and drinks",all:"All",veg:"Vegetarian",rec:"Chef's pick",v:"Veg",none:"No results for",items:"items",sto:"Table",
      note:"Digital menu demo. Dishes and prices come from the menu the restaurant published on Instagram in February 2024, so current prices may differ.",
      callT:"Call the waiter?",billT:"Ask for the bill?",callP:"The waiter in charge of your section gets a notification on their phone with your table number.",
      pick:"The table number comes from the QR code you scanned.",send:"Yes, call",cancel:"Cancel",
      okC:"The waiter has been notified",okB:"The bill is on its way",okP:(s,z)=>`Table ${s} · ${z}. Someone will be with you shortly.`,close:"OK",
      demo:"Demo: open the <a href='konobar.html' target='_blank'>waiter floor plan</a> in another window to see your table light up."}
};
const ZONES = [[1,8,"Reon A · terasa"],[9,14,"Reon B · sala"],[15,20,"Reon C · gornja terasa"]];
const zoneOf = n => (ZONES.find(z => n>=z[0] && n<=z[1]) || ZONES[1])[2];
let lang = "sr", veg = false, q = "";
let sto = parseInt(new URLSearchParams(location.search).get("sto")) || 7;
const $ = s => document.querySelector(s);
const fmt = p => typeof p === "number" ? p.toLocaleString("sr-RS") : p;
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"dj");
const hl = s => { if(!q) return esc(s); const i = norm(s).indexOf(norm(q)); return i<0 || norm(s).length!==s.length ? esc(s) : esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length)); };

function render(){
  const t = T[lang]; let total = 0;
  $("#menu").innerHTML = MENU.map(c => {
    const items = c.items.filter(it => (!veg || it[4].includes("v")) && (!q || norm(it[0]+" "+it[2]+" "+it[3]).includes(norm(q))));
    total += items.length; if(!items.length) return "";
    return `<section class="cat" id="${c.id}"><h2>${c[lang]} <small>${items.length} ${t.items}</small></h2>` + items.map(it => {
      const d = lang==="sr" ? it[2] : (it[3] || it[2]);
      return `<div class="item"><div><h3>${hl(it[0])}${it[4].includes("s")?`<span class="tag s">${t.rec}</span>`:""}${it[4].includes("v")?`<span class="tag v">${t.v}</span>`:""}</h3>${d?`<p>${hl(d)}</p>`:""}</div><span class="pr">${fmt(it[1])}<i>RSD</i></span></div>`;
    }).join("") + `</section>`;
  }).join("");
  $("#empty").style.display = total ? "none" : "block";
  $("#empty").textContent = `${t.none} „${q}”`;
  $("#chips").innerHTML = `<button class="chip veg ${veg?"on":""}" data-veg="1">🌿 ${t.veg}</button>` + MENU.map(c => `<a class="chip" href="#${c.id}" data-c="${c.id}">${c[lang]}</a>`).join("");
  $("#q").placeholder = t.ph; $("#note").textContent = t.note; $("#stoTxt").textContent = `${t.sto} ${sto}`;
  document.querySelectorAll("[data-sr]").forEach(el => el.textContent = el.dataset[lang]);
  document.documentElement.lang = lang==="sr" ? "sr-Latn" : "en";
  spy();
}
function spy(){
  const secs = [...document.querySelectorAll(".cat")]; let cur = secs[0]?.id;
  secs.forEach(s => { if(s.getBoundingClientRect().top < 150) cur = s.id; });
  document.querySelectorAll(".chip[data-c]").forEach(ch => { const on = ch.dataset.c===cur; if(on && !ch.classList.contains("on")) ch.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); ch.classList.toggle("on", on); });
}
addEventListener("scroll", spy, {passive:true});
$("#q").addEventListener("input", e => { q = e.target.value.trim(); $("#clr").style.display = q ? "block" : "none"; render(); });
$("#clr").onclick = () => { $("#q").value = ""; q = ""; $("#clr").style.display = "none"; render(); };
$("#chips").addEventListener("click", e => { if(e.target.closest("[data-veg]")){ veg = !veg; render(); } });
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; document.querySelectorAll(".lang button").forEach(x => x.classList.toggle("on", x===b)); render(); });

/* poziv konobara (demo: poziv se prenosi drugom prozoru preko localStorage) */
const ch = "BroadcastChannel" in window ? new BroadcastChannel("vrbak-pozivi") : null;
function ask(kind){
  const t = T[lang];
  $("#box").innerHTML = `<h3>${kind==="racun"?t.billT:t.callT}</h3><p>${t.callP}</p>
    <div class="where"><b>${t.sto} ${sto}</b><span>${zoneOf(sto)}</span><small>${t.pick}</small></div>
    <button class="go">${t.send}</button><button class="x">${t.cancel}</button>`;
  $("#sheet").classList.add("open");
  $("#box").onclick = e => {
    if(e.target.closest(".x")) return $("#sheet").classList.remove("open");
    if(e.target.closest(".go")) send(kind);
  };
}
function send(kind){
  const t = T[lang], call = {id:Date.now(), sto, reon:zoneOf(sto), vrsta:kind, vreme:new Date().toISOString(), status:"novo"};
  try{ const all = JSON.parse(localStorage.getItem("vrbak-pozivi") || "[]"); all.unshift(call); localStorage.setItem("vrbak-pozivi", JSON.stringify(all.slice(0,30))); }catch(e){}
  if(ch) ch.postMessage(call);
  if(navigator.vibrate) navigator.vibrate(40);
  $("#box").innerHTML = `<div class="ok"><div class="ring"><svg class="i" viewBox="0 0 24 24"><path d="M5 12l4.500 4.500L19 7"/></svg></div><h3>${kind==="racun"?t.okB:t.okC}</h3><p>${t.okP(sto, zoneOf(sto))}</p><button class="go x2">${t.close}</button><small>${t.demo}</small></div>`;
  $("#box").onclick = e => { if(e.target.closest(".x2")) $("#sheet").classList.remove("open"); };
}
document.querySelectorAll(".dock button").forEach(b => b.onclick = () => ask(b.dataset.kind));
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") e.target.classList.remove("open"); });
render();
if(location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 60);
</script>
</body>
</html>
