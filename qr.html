<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR kodovi za stolove · Vrbak Oh la la</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<style>
:root{--green:#1c2d28;--cream:#f4eee2;--paper:#fbf8f2;--orange:#e08a2e;--text:#4a5a54;--line:rgba(28,45,40,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Manrope",system-ui,sans-serif;background:var(--paper);color:#121a17;-webkit-font-smoothing:antialiased}
.wrap{width:min(1100px,100% - 32px);margin-inline:auto;padding:34px 0 60px}
.logo{font-family:"Cormorant Garamond",serif;font-size:1.5rem;font-weight:600;letter-spacing:.05em}
.logo span{font-family:"Parisienne",cursive;color:var(--orange);letter-spacing:0;margin-left:6px}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(2rem,5vw,3rem);margin:18px 0 8px;line-height:1.05}
p.lead{color:var(--text);max-width:64ch;line-height:1.6}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 26px}
.tools a,.tools button{font:inherit;font-weight:700;font-size:.9rem;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:#fff;color:inherit;text-decoration:none;cursor:pointer}
.tools button{background:var(--green);color:var(--cream);border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--green);color:var(--cream);border-radius:22px;padding:18px 16px 16px;text-align:center;break-inside:avoid;text-decoration:none;display:block}
.card .l{font-family:"Cormorant Garamond",serif;font-size:1.05rem;letter-spacing:.06em}
.card .l span{font-family:"Parisienne",cursive;color:var(--orange);letter-spacing:0;margin-left:4px}
.qr{background:#fff;border-radius:14px;padding:10px;margin:12px auto;width:156px;height:156px;display:grid;place-items:center}
.qr img,.qr canvas{width:136px!important;height:136px!important}
.card b{display:block;font-size:1.5rem;font-weight:800}
.card small{display:block;color:#b9c6c0;font-size:.74rem;margin-top:2px}
.card em{display:inline-block;font-style:normal;margin-top:10px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
@media print{.tools,p.lead{display:none}body{background:#fff}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">VRBAK<span>Oh la la</span></div>
  <h1>QR kodovi za stolove</h1>
  <p class="lead">Svaki sto ima svoj kod. Kada ga gost skenira, otvara se meni koji već zna broj stola, pa dugme „Pozovi konobara” šalje poziv baš sa tog stola. Skenirajte bilo koji kod telefonom da isprobate.</p>
  <div class="tools"><button onclick="print()">Odštampaj kodove</button><a href="konobar.html" target="_blank">Plan sale za konobara</a><a href="index.html">Nazad na sajt</a></div>
  <div class="grid" id="grid"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const base = location.href.replace(/[^/]*$/, "") + "meni.html?sto=";
const zone = n => n <= 8 ? "Terasa" : n <= 14 ? "Sala" : "Gornja terasa";
const grid = document.getElementById("grid");
for(let n = 1; n <= 20; n++){
  const a = document.createElement("a"); a.className = "card"; a.href = base + n; a.target = "_blank";
  a.innerHTML = `<div class="l">VRBAK<span>Oh la la</span></div><div class="qr" id="q${n}"></div><b>Sto ${n}</b><small>${zone(n)}</small><em>Skeniraj za meni</em>`;
  grid.appendChild(a);
  new QRCode(document.getElementById("q" + n), {text: base + n, width: 272, height: 272, correctLevel: QRCode.CorrectLevel.M});
}
</script>
</body>
</html>
